<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>REPS</title>
    <style>
      /* Pre-JS skeleton: same boxes as the React skeleton so the page is never blank. */
      html, body { margin: 0; background: #f3f4f7; }
      .pre { max-width: 448px; margin: 0 auto; padding: 0 16px; box-sizing: border-box; }
      .pre * { box-sizing: border-box; }
      .pre .row { display: flex; align-items: center; justify-content: space-between; }
      .pre .glass { background: rgb(255 255 255 / 0.6); border: 1px solid rgb(255 255 255 / 0.8); box-shadow: 0 12px 32px -8px rgb(15 23 42 / 0.12); }
      .pre .sk { background: linear-gradient(100deg, rgb(15 23 42 / 0.06) 30%, rgb(15 23 42 / 0.12) 50%, rgb(15 23 42 / 0.06) 70%); background-size: 300% 100%; animation: pre-sh 1.4s ease-in-out infinite; }
      @keyframes pre-sh { from { background-position: 100% 0; } to { background-position: 0 0; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre" aria-busy="true" data-testid="skeleton-static">
        <div class="row" style="height: 64px">
          <div class="sk" style="height: 28px; width: 96px; border-radius: 8px"></div>
          <div style="display: flex; gap: 8px">
            <div class="sk" style="height: 40px; width: 40px; border-radius: 50%"></div>
            <div class="sk" style="height: 40px; width: 40px; border-radius: 50%"></div>
          </div>
        </div>
        <div class="glass" style="margin-bottom: 12px; border-radius: 24px; padding: 14px 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <div class="sk" style="height: 12px; width: 144px; border-radius: 6px"></div>
          <div class="sk" style="height: 20px; width: 256px; border-radius: 6px"></div>
          <div class="sk" style="height: 20px; width: 176px; border-radius: 6px"></div>
          <div class="sk" style="height: 12px; width: 128px; border-radius: 6px"></div>
        </div>
        <div class="glass" style="border-radius: 28px; padding: 16px">
          <div style="display: flex; gap: 8px">
            <div class="sk" style="height: 40px; width: 64px; border-radius: 99px"></div>
            <div class="sk" style="height: 40px; width: 56px; border-radius: 99px"></div>
            <div class="sk" style="height: 40px; width: 60px; border-radius: 99px"></div>
            <div class="sk" style="height: 40px; width: 52px; border-radius: 99px"></div>
          </div>
          <div class="row" style="margin-top: 20px">
            <div>
              <div class="sk" style="height: 56px; width: 176px; border-radius: 12px"></div>
              <div class="sk" style="height: 16px; width: 112px; border-radius: 6px; margin-top: 8px"></div>
            </div>
            <div class="sk" style="height: 80px; width: 80px; border-radius: 50%"></div>
          </div>
        </div>
        <div class="row" style="margin-top: 28px">
          <div class="sk" style="height: 24px; width: 96px; border-radius: 8px"></div>
          <div class="sk" style="height: 40px; width: 40px; border-radius: 50%"></div>
        </div>
        <div class="glass" style="height: 76px; border-radius: 22px; margin-top: 12px"></div>
        <div class="glass" style="height: 76px; border-radius: 22px; margin-top: 10px"></div>
        <div class="glass" style="height: 76px; border-radius: 22px; margin-top: 10px"></div>
        <div class="glass" style="height: 76px; border-radius: 22px; margin-top: 10px"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
