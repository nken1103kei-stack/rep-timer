<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2028"/><stop offset="1" stop-color="#0b0c0f"/></linearGradient><linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff4f00"/></linearGradient></defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- stopwatch: crown button + side button -->
  <rect x="222" y="62" width="68" height="34" rx="12" fill="#ff7a1a"/>
  <rect x="244" y="92" width="24" height="30" rx="6" fill="#ff7a1a"/>
  <rect x="372" y="118" width="30" height="46" rx="10" fill="#ff7a1a" transform="rotate(45 387 141)"/>
  <!-- dial: track + 3/4 progress -->
  <circle cx="256" cy="282" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="30"/>
  <path d="M256 132 A150 150 0 1 1 106 282" fill="none" stroke="url(#arc)" stroke-width="30" stroke-linecap="round"/>
  <!-- ticks -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round">
    <path d="M256 170v16"/><path d="M256 394v-16"/>
  </g>
  <!-- dumbbell -->
  <g fill="#ffffff">
    <rect x="186" y="271" width="140" height="22" rx="8"/>
    <rect x="176" y="222" width="30" height="120" rx="10"/>
    <rect x="148" y="240" width="24" height="84" rx="9"/>
    <rect x="306" y="222" width="30" height="120" rx="10"/>
    <rect x="340" y="240" width="24" height="84" rx="9"/>
  </g>
</svg>
